---
- hosts: R3
  gather_facts: false
  connection: network_cli

  tasks:
# Demo a loop with list
    - name: ping loopback on R1 from R3 in vrf A
      cisco.ios.ios_command:
        commands: ping vrf A {{item}} repeat 5
      with_items: ['1.1.1.1','7.7.7.7']
      register: ping_output
      
# Demo a loop with dict
    - name: create loopbacks and assign IP addresses
      cisco.ios.ios_config:
        lines: ip address {{item.value}} 255.255.255.255
        parents: interface loopback {{item.key}}
      with_dict: ['11':'11.11.11.11','12':'12.12.12.12','13':'13.13.13.13','14':'14.14.14.14']

    - name: see the interfaces with IP
      cisco.ios.ios_command:
        commands: show ip int brief

      register: output

    - name: print the output
      debug:
        var=output.stdout_lines
