---
- name: Configure domain name
  hosts: R1
  gather_facts: false
  connection: network_cli

  tasks:
    - name: Send Command
      cisco.ios.ios_command:
        commands:
          - show version | include Version
          - show ip interface brief
#        match: all
#        wait_for:
#          - result[0] contains cisco
#          - result[1] contains GigabitEthernet
      register: show_command_output

    - name: Print show version
      ansible.builtin.debug:
        var=show_command_output.stdout_lines[0]

    - name: Print show ip int brief
      ansible.builtin.debug:
        msg: "{{ show_command_output.stdout_lines[1] }}"

- hosts: R2
  gather_facts: false
  connection: network_cli

  tasks:
    - name: clear counters
      cisco.ios.ios_command:
        commands:
         - command: "clear counters fa0/1"
           prompt: "[confirm]"
           answer: "y"
#           answer: "\r" to accept default
      register: clear_counter

    - name: Print clear counter
      ansible.builtin.debug:
        msg: "{{ clear_counter }}"
